name: ai_speaking_flutter_app
description: HOMI speaking assistant for Android, iOS, and installable web.
publish_to: none
version: 1.0.8+10

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  audio_session: ^0.2.4
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  google_mlkit_translation:
    path: third_party/google_mlkit_translation
  http: ^1.6.0
  just_audio: ^0.10.6
  local_auth: ^3.0.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  record: ^7.1.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/data/listening_lessons.json
    - assets/data/listening_topic_patch_v42.json
    - assets/data/listening_audio_manifest_v4.json
    - assets/data/listening_ai_lexicon_v4.json
    - assets/data/homi_ai_fallback_catalog_v1.json
    - assets/data/main_assistant_audio.json
    - assets/data/homi_gap66_audio.json
    # Fixed navigation/vocabulary prompts must be available without the CDN.
    - assets/audio/MAIN/
    - assets/audio/MAIN/GAP66/
    - assets/audio/LESSON_HOOKS/
    # Compact curriculum system and topic-selection prompts (not full lessons).
    - assets/audio/CURRICULUM/ed3ba010c50d9440f2eb9692.vi.v1.mp3
    - assets/audio/CURRICULUM/ca9aea52e38a6261f087e2f5.vi.v1.mp3
