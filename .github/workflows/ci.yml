name: ci
run-name: CI for ${{ inputs.target_ref }}

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit SHA to test (for example dev or a PR branch)
        required: true
        type: string
        default: dev

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve target revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  architecture:
    name: Verify architecture boundaries
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/check_architecture_boundaries.dart

  validate:
    name: Analyze and test Flutter
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Test iOS build helpers
        run: |
          python3 -B -m unittest discover -s tool -p test_select_ios_test_simulator.py
          python3 -B -m unittest discover -s tool -p test_prepare_ios_translation_pods.py
      - name: Test Flutter logic and widgets
        run: |
          NON_GOLDEN_TESTS="$(find test -type f -name '*_test.dart' ! -name '*golden*.dart' -print | while IFS= read -r file; do
            if ! grep -q 'matchesGoldenFile' "$file"; then
              printf '%s\n' "$file"
            fi
          done)"
          if [ -z "$NON_GOLDEN_TESTS" ]; then
            echo "No platform-independent Flutter tests were found."
            exit 1
          fi
          flutter test $NON_GOLDEN_TESTS

  android:
    name: Build Android APK
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK without publishing
        run: >
          flutter build apk --release
          --dart-define-from-file=dart_defines.production.json
          --dart-define=ENABLE_AIV0_BLE_CONTROL=true
          --dart-define=ENABLE_HFP_AUDIO=true
      - uses: actions/upload-artifact@v4
        with:
          name: homi-android-${{ github.run_id }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Build iOS Simulator and test native code
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify audio loudness manifest
        run: python3 tool/measure_audio_loudness.py --check
      - name: Prepare Simulator translation adapter
        run: python3 tool/prepare_ios_translation_pods.py simulator
      - name: Build Simulator app without signing
        env:
          HOMI_IOS_TRANSLATION_SIMULATOR_STUB: '1'
        run: >
          flutter build ios --simulator --debug
          --dart-define=BACKEND_BASE_URL=https://speaking-ai-nextjs-backend-production.up.railway.app
          --dart-define=USE_DEMO_BACKEND=false
          --dart-define=CHILD_AGE=6
          --dart-define=PREFER_BLE_STREAMING=false
          --dart-define=REALTIME_BATCH_FALLBACK=true
          --dart-define=REALTIME_FALLBACK_BUFFER_BYTES=15728640
          --dart-define=ENABLE_AIV0_BLE_CONTROL=true
          --dart-define=AIV0_DRAFT_PROTOCOL_CONFIRMED=false
          --dart-define=ENABLE_HFP_AUDIO=true
      - name: Run iOS native tests on Simulator
        run: |
          mkdir -p build/ios/test-results
          xcodebuild -showdestinations \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner | tee build/ios/test-results/destinations.log
          SIMULATOR_UDID="$(python3 tool/select_ios_test_simulator.py < build/ios/test-results/destinations.log)"
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID,arch=arm64" \
            -resultBundlePath build/ios/test-results/RunnerTests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Package Simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app "$RUNNER_TEMP/homi-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: homi-ios-simulator-${{ github.run_id }}
          path: ${{ runner.temp }}/homi-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
