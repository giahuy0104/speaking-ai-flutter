name: ci
run-name: CI for ${{ inputs.target_ref || github.head_ref || github.ref_name }}

on:
  pull_request:
    branches: [dev]
    paths: [.github/workflows/ci.yml]
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or PR merge ref to test (for example dev or refs/pull/22/merge)
        required: true
        type: string
        default: dev

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.target_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve target revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.sha }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  architecture:
    name: Verify architecture boundaries
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/check_architecture_boundaries.dart

  audio-manifest:
    name: Verify audio loudness manifest
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - run: python3 tool/measure_audio_loudness.py --check

  validate:
    name: Analyze and test Flutter
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Test iOS build helpers
        run: |
          python3 -B -m unittest discover -s tool -p test_select_ios_test_simulator.py
          python3 -B -m unittest discover -s tool -p test_prepare_ios_translation_pods.py
      - name: Test Flutter logic and widgets
        run: |
          NON_GOLDEN_TESTS="$(find test -type f -name '*_test.dart' ! -name '*golden*.dart' -print | while IFS= read -r file; do
            if ! grep -q 'matchesGoldenFile' "$file"; then
              printf '%s\n' "$file"
            fi
          done)"
          if [ -z "$NON_GOLDEN_TESTS" ]; then
            echo "No platform-independent Flutter tests were found."
            exit 1
          fi
          flutter test $NON_GOLDEN_TESTS
