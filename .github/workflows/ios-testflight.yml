# Builds the signed App Store IPA on the self-hosted runner on the m4 Mac (labels: self-hosted,
# macOS, ARM64) and, on request, uploads it to TestFlight. Nothing secret is stored in GitHub:
# the Apple Distribution identity is in ~/Library/Keychains/homi-signing.keychain-db on the runner
# (password in ~/.appstoreconnect/homi/kc_pass), the App Store profile is installed under
# ~/Library/Developer/Xcode/UserData/Provisioning Profiles, and ~/.appstoreconnect/homi/env.sh
# exports the App Store Connect API key for codemagic-cli-tools, which is on the runner's PATH.
# When the profile expires, refresh it on the runner Mac with:
#   source ~/.appstoreconnect/homi/env.sh && app-store-connect fetch-signing-files com.innotrik.aispeaking --type IOS_APP_STORE
name: ios-testflight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the IPA to TestFlight (group HOMI Test)
        type: boolean
        default: false
      backend:
        description: Backend the app talks to
        type: choice
        options:
          - production
          - api-dev
        default: production

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: flutter --version && xcodebuild -version
      - run: flutter pub get
      - name: Apply the profile and build the signed IPA
        # Keychain unlock / search-list state on this self-hosted runner does not reliably survive
        # between separate `run:` steps (each is its own shell process, and the runner has no stable
        # login-session keychain context), so signing setup and the build run in ONE step/process -
        # that's what makes the identity still resolvable by `flutter build ipa`'s own signing check.
        #
        # codemagic-cli-tools matches profiles against certificates in the default keychain only, so
        # the signing keychain is made the default here and restored in a final `if: always()` step.
        #
        # Same dart-defines as the Codemagic ios-app-store workflow; the build number is one past
        # the latest TestFlight build, like the manual TestFlight recipe. The api-dev choice only
        # overrides BACKEND_BASE_URL: a later --dart-define wins over the defines file.
        env:
          BACKEND_CHOICE: ${{ inputs.backend || 'production' }}
        run: |
          KC=~/Library/Keychains/homi-signing.keychain-db
          KC_PASS="$(cat ~/.appstoreconnect/homi/kc_pass)"
          security list-keychains -d user -s ~/Library/Keychains/login.keychain-db "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings "$KC"
          # Without this, the private key's ACL has no non-interactive entry for codesign/security,
          # so xcodebuild/codesign would need a GUI keychain prompt to use it - which never appears
          # on a headless CI session, so signing silently fails ("No valid code signing certificates
          # were found") even though `security find-identity` still lists the certificate.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          security default-keychain -s "$KC"
          source ~/.appstoreconnect/homi/env.sh
          case "$BACKEND_CHOICE" in
            production) BACKEND_BASE_URL=https://api.hoamytech.com ;;
            api-dev) BACKEND_BASE_URL=https://api-dev.hoamytech.com ;;
            *) echo "Unknown backend: $BACKEND_CHOICE" >&2; exit 1 ;;
          esac
          echo "Backend: $BACKEND_CHOICE ($BACKEND_BASE_URL)"
          # pod install's "Integrating client project" step rewrites Runner.xcodeproj, which was
          # wiping out the manual signing settings xcode-project use-profiles had just applied -
          # that's why flutter build ipa kept reporting no valid certificates right after this
          # project's own cert/profile matching had succeeded. Apply profiles AFTER pods, last.
          python3 tool/prepare_ios_translation_pods.py device
          xcode-project use-profiles --project ios/Runner.xcodeproj --export-options-plist "$RUNNER_TEMP/export_options.plist"
          echo "::group::Resolved Release build settings"
          xcodebuild -showBuildSettings -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos 2>&1 \
            | grep -E "DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE|error:" || true
          echo "::endgroup::"
          BUILD_NUMBER=$(( $(app-store-connect get-latest-testflight-build-number 6804089228) + 1 ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=homi-ios-$BUILD_NUMBER-$BACKEND_CHOICE-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          flutter build ipa --release --build-number="$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/export_options.plist" \
            --dart-define-from-file=dart_defines.production.json \
            --dart-define=BACKEND_BASE_URL="$BACKEND_BASE_URL" \
            --dart-define=CHILD_AGE=6 \
            --dart-define=PREFER_BLE_STREAMING=false \
            --dart-define=REALTIME_BATCH_FALLBACK=true \
            --dart-define=REALTIME_FALLBACK_BUFFER_BYTES=15728640 \
            --dart-define=ENABLE_AIV0_BLE_CONTROL=true \
            --dart-define=AIV0_DRAFT_PROTOCOL_CONFIRMED=false \
            --dart-define=ENABLE_HFP_AUDIO=true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Upload to TestFlight
        if: inputs.upload
        run: |
          source ~/.appstoreconnect/homi/env.sh
          app-store-connect publish --path build/ios/ipa/*.ipa --testflight --beta-group "HOMI Test" --expire-build-submitted-for-review
      - name: Restore the login keychain as default
        if: always()
        run: security default-keychain -s ~/Library/Keychains/login.keychain-db
